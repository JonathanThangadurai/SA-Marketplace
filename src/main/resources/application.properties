spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.mode=always
spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.jdbc-url=${spring.datasource.url}

# Live NL day-ahead price source (see github.com/JonathanThangadurai/eu-power-poc),
# used by PriceService instead of the old fixed 1.0/2.0/3.0 pricing constants.
rec.price.api-url=${EU_PRICE_API_URL:http://localhost:8001}
rec.price.cache-seconds=${EU_PRICE_CACHE_SECONDS:60}
rec.price.fallback-eur-per-kwh=${EU_PRICE_FALLBACK:0.10}